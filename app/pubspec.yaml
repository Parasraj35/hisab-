name: hisab
description: HISAB - Manage Money. Make Better Decisions.
publish_to: 'none'
version: 1.1.2+4

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  flutter_secure_storage: ^9.0.0
  go_router: ^14.1.0
  intl: ^0.19.0
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0
  image_picker: ^1.1.1
  local_auth: ^2.2.0
  path_provider: ^2.1.3
  share_plus: ^12.0.2
  open_filex: ^4.4.0
  google_mobile_ads: ^9.1.0
  sentry_flutter: ^9.29.0
  sqflite: ^2.4.1
  path: ^1.9.0
  uuid: ^4.5.1
  pdf: ^3.11.1
  bcrypt: ^1.1.3
  url_launcher: ^6.3.1
  package_info_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "icons/icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  # The source art already fills ~95% of its own canvas edge-to-edge — the
  # washed-out/padded look on Android wasn't the artwork, it was the missing
  # adaptive-icon XML: without one, Android 8+ launchers synthesize their own
  # safe-zone shrink around a legacy square icon, adding padding on top of
  # padding. Declaring a real adaptive icon (foreground = the unchanged
  # artwork, background = the same green so any mask clipping is invisible)
  # stops that synthetic shrink.
  adaptive_icon_background: "#00563B"
  adaptive_icon_foreground: "icons/icon_foreground.png"
