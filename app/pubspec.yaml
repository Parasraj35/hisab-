name: hisab
description: HISAB - Manage Money. Make Better Decisions.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  dio: ^5.4.3
  flutter_secure_storage: ^9.0.0
  go_router: ^14.1.0
  intl: ^0.19.0
  google_fonts: ^6.2.1
  pin_code_fields: ^8.0.1
  fl_chart: ^0.68.0
  image_picker: ^1.1.1
  local_auth: ^2.2.0
  path_provider: ^2.1.3
  share_plus: ^12.0.2
  open_filex: ^4.4.0
  google_mobile_ads: ^9.1.0
  sentry_flutter: ^9.29.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "icons/icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
